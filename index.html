<style>
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100dvh;font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#111;background:#fff}
header{display:flex;align-items:center;gap:6px;padding:calc(7px + env(safe-area-inset-top)) 10px 7px 12px;background:#14532d;color:#fff}
h1{flex:1;margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#list{flex:none;max-height:30dvh;overflow:auto;margin:0;padding:0;list-style:none;border-top:1px solid #e5e7eb}

.badge img{width:16px;height:16px;border-radius:3px;background:#fff}

.pop ul{margin:0 0 6px;padding-left:16px;max-height:38vh;overflow:auto;font-size:13px}

<body>
<header>
  <h1>📉 台股QQ美食地圖</h1>
  <button id="loc">📍 我附近</button>
  <button id="here">↻ 更新</button>
</header>
<div id="status">定位中…</div>
<div id="map"></div>
<ul id="list"></ul>
<nav class="tabs"><a href="index.html" class="on">🗺️ 地圖</a><a href="times.html">⏰ 台股進場時間點供餐</a></nav>
<footer>非任何超商官方，商標屬各公司所有；權利人來信要求即移除 · <a href="https://forms.gle/jfMyHiuh2kVS1suAA" target="_blank" rel="noopener">聯絡我</a></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- ponytail: 其他四家門市是靜態清單（make_stores.py 產生），開關店會漏，偶爾重跑一次就好 -->
<!-- 網域上的靜態檔會被瀏覽器快取 4 小時：stores.js 有更新就改這個版本號 -->
<script src="stores.js?v=20261105c"></script>
<script>
// 全家 App「友善食光地圖」背後的非公開 API：不用登入、允許跨網域，但隨時可能改
const FM_API = 'https://stamp.family.com.tw/api/maps/MapProductInfo';
const RADIUS = 1000; // 其他品牌門市的顯示半徑（公尺）
// logo 取自各家官網 favicon，商標屬各公司所有
const BRANDS = {
  '全家': {logo: 'logos/fm.png', note: '目前查不到友善食光商品（可能賣完了，或全家資料暫時載入失敗）'},
  '7-11': {logo: 'logos/711.png', app: {name: 'OPENPOINT', ios: 'https://apps.apple.com/tw/app/id1014238801', android: 'https://play.google.com/store/apps/details?id=tw.net.pic.m.openpoint'}, note: '庫存要在 OPENPOINT App 裡查：登入後點「服務」→「i地圖」→「i珍食」（網頁拿不到）'},
  '萊爾富': {logo: 'logos/hilife.png', note: '官方沒有即期品即時庫存。惜福食堂：每日 17:00–23:59 指定鮮食 7 折，以現場為準'},
  'OK': {logo: 'logos/ok.png', note: '「午後6折惜食光」16:30 起，官方沒有即時庫存，只能現場碰運氣'},
  '全聯': {logo: 'logos/px.png', radius: 3000, app: {name: '全聯', ios: 'https://apps.apple.com/tw/app/id432477263', android: 'https://play.google.com/store/apps/details?id=com.pxmart.android'}, note: '庫存要在全聯 App 裡查：登入後點「我的」→「惜食地圖」，每天 18:00 起（網頁拿不到）'},
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => `&#${ch.charCodeAt(0)};`);
const num = x => Number(x) || 0; // 外部 API 的數字一律轉成數字，避免被塞進 HTML
const hhmm = d => d ? new Date(d).toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit', hour12: false}) : '?';
const nav = (lat, lng) => `<a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" rel="noopener">導航</a>`;
const lg = b => `<img class="lg" src="${BRANDS[b].logo}" alt="">`;
// 官方 App 按鈕：iPhone 開 App Store、Android 開 Google Play（已安裝的話商店頁可直接「開啟」）
const appBtn = b => { const a = BRANDS[b].app; return a ? `<a class="appbtn" href="${/android/i.test(navigator.userAgent) ? a.android : a.ios}" target="_blank" rel="noopener">打開 ${a.name} App</a>` : ''; };
const ICONS = {};
for (const b in BRANDS) ICONS[b] = L.icon({iconUrl: BRANDS[b].logo, iconSize: [18, 18], className: 'logo'});

const map = L.map('map').setView([25.0478, 121.517], 16); // 定位失敗時停在台北車站
// 底圖：16 級以內用 Esri 淡灰畫布（只留主要路名）；它在台灣只到 16 級，再放大會糊，
// 所以 17 級以上換 Esri 街道圖（原生到 18 級、一樣沒有門牌編號），套灰階讓顏色一致
const esri = s => `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`;
L.tileLayer(esri('Canvas/World_Light_Gray_Base'), {maxZoom: 16, attribution: 'Tiles © Esri｜門市資料 © OpenStreetMap 貢獻者'}).addTo(map);
L.tileLayer(esri('World_Street_Map'), {minZoom: 17, maxNativeZoom: 18, maxZoom: 19, className: 'street'}).addTo(map);
const ctl = L.control.layers(null, null, {position: 'topright'}).addTo(map);
const layers = {};
for (const b in BRANDS) {
  layers[b] = L.layerGroup().addTo(map);
  ctl.addOverlay(layers[b], lg(b) + b);
}

async function getFM(c) {
  const r = await fetch(FM_API, {
    method: 'POST',
    headers: {'Content-Type': 'application/json;charset=utf-8'},
    body: JSON.stringify({ProjectCode: '202106302', OldPKeys: [], PostInfo: '', Latitude: c.lat, Longitude: c.lng}),
  });
  const j = await r.json();
  if (j.code !== 1) throw Error(j.message || `code ${j.code}`);
  return j.data;
}

function drawFM(stores) {
  let inStock = 0, total = 0;
  for (const s of stores) {
    const info = (s.info || []).filter(i => num(i.qty));
    const qty = info.reduce((n, i) => n + num(i.qty), 0);
    const ll = [num(s.latitude), num(s.longitude)];
    const items = info.map(i => `<li><b>${esc(i.name)} ${num(i.qty)}</b><br>` +
      i.categories.flatMap(c => c.products).filter(p => num(p.qty)).map(p => `${esc(p.name)}×${num(p.qty)}`).join('、') + '</li>').join('');
    // 即時資料蓋掉清單裡同一家店的淡色標記（同店兩份資料座標會差幾公尺）
    fmStatic.filter(m => map.distance(m.getLatLng(), ll) < 40).forEach(m => layers['全家'].removeLayer(m));
    const icon = qty ? L.divIcon({className: '', html: `<div class="badge"><img src="${BRANDS['全家'].logo}" alt="">${qty}</div>`, iconSize: [50, 24]}) : ICONS['全家'];
    const m = L.marker(ll, {icon, opacity: qty ? 1 : 0.4, zIndexOffset: qty ? 1000 : 0}) // 有貨的壓在最上面
      .bindPopup(`<div class="pop"><h3>${lg('全家')}${esc(s.name)}</h3><p>${esc(s.address)}<br>${Math.round(s.distance)} m · ${hhmm(s.updateDate)} 更新</p>` +
        (qty ? `<ul>${items}</ul>` : '<p>目前沒有友善食光商品</p>') +
        `<a href="tel:${esc(s.tel)}">打電話問</a> · ${nav(...ll)}</div>`)
      .addTo(layers['全家']);
    if (!qty) continue;
    inStock++;
    total += qty;
    const li = document.createElement('li');
    li.innerHTML = `<span>${esc(s.name)}<br><small>${Math.round(s.distance)} m · ${esc(info.map(i => i.name).join('、'))}</small></span><span class="qty">${qty}</span>`;
    li.onclick = () => { map.setView(ll, 17); m.openPopup(); };
    $('list').append(li);
  }
  return `全家 ${inStock} 家有貨・${total} 件`;
}

let fmStatic = []; // 全家清單畫出的淡色標記，有即時庫存的會被換掉
function drawStores(c) {
  if (typeof STORES === 'undefined') return '找不到 stores.js，其他超商不會顯示';
  const n = [];
  let px; // 最近的全聯
  fmStatic = [];
  for (const [b, list] of Object.entries(STORES)) {
    const r = BRANDS[b].radius || RADIUS;
    let k = 0;
    for (const [name, lat, lng, tel] of list) {
      const d = map.distance(c, [lat, lng]);
      if (d > r) continue;
      k++;
      const title = name.includes(b) ? name : `${b} ${name || '（未標店名）'}`;
      const m = L.marker([lat, lng], {icon: ICONS[b], opacity: b === '全家' ? 0.4 : 1})
        .bindPopup(`<div class="pop"><h3>${lg(b)}${esc(title)}</h3><p>${Math.round(d)} m</p><p>${BRANDS[b].note}</p>${appBtn(b)}${tel ? `<a href="tel:${esc(tel)}">打電話問 ${esc(tel)}</a> · ` : ''}${nav(lat, lng)}</div>`)
        .addTo(layers[b]);
      if (b === '全家') fmStatic.push(m);
      if (b === '全聯' && (!px || d < px.d)) px = {m, d, name};
    }
    if (k && b !== '全家') n.push(`${b} ${k}`);
  }
  if (px) { // 全聯比超商稀疏、常在畫面外：最近一家放列表第一列，點了就跳過去
    const li = document.createElement('li');
    li.innerHTML = `<span>${lg('全聯')}最近的全聯：${esc(px.name)}</span><small>${Math.round(px.d)} m</small>`;
    li.onclick = () => { map.setView(px.m.getLatLng(), 17); px.m.openPopup(); };
    $('list').prepend(li);
  }
  return n.length ? `附近 ${n.join('・')}` : '附近沒有其他超商';
}

let seq = 0, last; // last：上次搜尋的中心
function load(c, note = '') {
  const my = ++seq; // 使用者又按了一次搜尋時，舊的回應直接丟掉
  last = c;
  $('list').replaceChildren();
  Object.values(layers).forEach(l => l.clearLayers());
  const st = {note, fm: '全家載入中…', others: drawStores(c)};
  const show = () => { if (my === seq) $('status').textContent = Object.values(st).filter(Boolean).join('｜'); };
  show();
  getFM(c)
    .then(d => { if (my === seq) st.fm = drawFM(d); })
    .catch(e => { st.fm = `全家資料載入失敗（${e.message}）`; }) // 也接住 API 改格式造成的錯
    .finally(show);
}

let me;
map.on('locationfound', e => {
  me?.remove();
  me = L.circleMarker(e.latlng, {radius: 8, color: '#fff', weight: 3, fillColor: '#111', fillOpacity: 1, interactive: false}).addTo(map);
  load(e.latlng);
});
map.on('locationerror', () => load(map.getCenter(), '定位失敗，請允許定位權限'));
$('loc').onclick = () => map.locate({setView: true, maxZoom: 16});
$('here').onclick = () => load(map.getCenter());
// 拖完地圖自動搜尋（只聽手動拖曳，點列表跳轉不會觸發而洗掉開著的說明）
map.on('dragend', () => { if (!last || map.distance(map.getCenter(), last) > 300) load(map.getCenter()); });
$('loc').onclick();
</script>
</body>
